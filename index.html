<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMHS Code Sandboxes</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f12;
      --card-bg: #13161b;
      --border: #252a33;
      --text: #d4d8e0;
      --muted: #5a6070;
      --python: #4df0a0;
      --java: #f7c948;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 10px;
    }

    .logo span { color: var(--muted); }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .container {
      display: flex;
      gap: 30px;
      max-width: 900px;
      width: 90%;
    }

    .card {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--hover-color);
      box-shadow: 0 10px 30px -10px var(--hover-color);
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
    }

    .card h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: var(--hover-color);
    }

    .card p {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Color Overrides */
    .python-card { --hover-color: var(--python); }
    .java-card { --hover-color: var(--java); }

    .btn {
      margin-top: 25px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 10px 20px;
      border: 1px solid var(--hover-color);
      color: var(--hover-color);
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    footer {
      position: absolute;
      bottom: 30px;
      font-size: 0.7rem;
      color: var(--muted);
    }

    @media (max-width: 650px) {
      .container { flex-direction: column; }
      body { height: auto; padding: 50px 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">HMHS<span>/</span>Sandbox</div>
    <p class="subtitle">Select your development environment</p>
  </header>

  <div class="container">
    <a href="python.html" class="card python-card">
      <div class="icon">🐍</div>
      <h2>Python</h2>
      <p>Python Sandbox.</p>
      <div class="btn">Launch Editor</div>
    </a>

    <a href="java.html" class="card java-card">
      <div class="icon">☕</div>
      <h2>Java</h2>
      <p>Java Sandbox.</p>
      <div class="btn">Launch Editor</div>
    </a>
  </div>

  <footer>
    &copy; Haddonfield Memorial High School • Computer Science
  </footer>

</body>
</html>
