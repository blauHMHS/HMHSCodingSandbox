<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMHS CSClub Java Sandbox</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/keymap/sublime.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f12; --surface: #13161b; --panel: #181c22; --border: #252a33;
    --accent: #f7c948; --accent2: #4df0a0; --danger: #f75c5c; --text: #d4d8e0;
    --muted: #5a6070; --tab-h: 42px; --toolbar-h: 52px;
  }
  :root.light {
    --bg: #f5f5f0; --surface: #eaeae4; --panel: #e0e0d8; --border: #c8c8be;
    --accent: #d4a000; --accent2: #1a9e60; --danger: #d63030; --text: #1a1a1a;
    --muted: #7a7a70;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; overflow: hidden; }
  #topbar { height: var(--toolbar-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 18px; gap: 14px; }
  #logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.15rem; color: var(--accent); }
  #logo span { color: var(--text); opacity: .5; }
  .spacer { flex: 1; }
  #runtime-status { font-size: .7rem; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  #status-dot.loading { background: var(--accent); animation: pulse 1s infinite; }
  #status-dot.ready { background: var(--accent2); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .btn-base { display: flex; align-items: center; gap: 7px; border-radius: 5px; padding: 0 16px; height: 32px; font-family: 'JetBrains Mono'; font-size: .8rem; font-weight: 700; cursor: pointer; transition: all .15s; border: 1px solid var(--border); }
  #run-btn { background: var(--accent); color: #0d0f12; border: none; }
  #run-btn:disabled { opacity: .35; cursor: not-allowed; }
  #app { display: flex; flex-direction: column; height: calc(100vh - var(--toolbar-h)); }
  #tabbar { height: var(--tab-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: flex-end; padding: 0 10px; gap: 2px; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 12px; height: 34px; border-radius: 5px 5px 0 0; background: transparent; color: var(--muted); font-size: .75rem; cursor: pointer; position: relative; top: 1px; }
  .tab.active { background: var(--bg); border: 1px solid var(--border); border-bottom: none; color: var(--accent); }
  #split { display: flex; flex: 1; overflow: hidden; }
  #editor-wrap { flex: 1; min-width: 0; }
  .CodeMirror { height: 100% !important; background: var(--bg) !important; }
  #output-panel { width: 38%; background: var(--panel); display: flex; flex-direction: column; }
  #output { flex: 1; overflow-y: auto; padding: 14px; font-size: .8rem; white-space: pre-wrap; }
  .prompt { color: var(--accent); }
  .err-line { color: var(--danger); }
</style>
</head>
<body>

<div id="topbar">
  <div id="logo">HMHS<span>/</span>Java-Sandbox</div>
  <div class="spacer"></div>
  <div id="runtime-status">
    <div id="status-dot" class="loading"></div>
    <span id="status-text">Starting JVM…</span>
  </div>
  <button id="run-btn" class="btn-base" disabled>RUN</button>
</div>

<div id="app">
  <div id="tabbar"><button id="add-tab-btn" style="display:none">+</button></div>
  <div id="split">
    <div id="editor-wrap"></div>
    <div id="output-panel">
      <div id="output"></div>
    </div>
  </div>
</div>

<script src="https://cjrtnc.leaningtech.com/3.0/loader.js"></script>

<script>
// 1. Setup Data
const DEFAULTS = [
  { id: 0, name: 'Main.java', code: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello HMHS Computer Science!");\n        \n        for(int i=1; i<=5; i++) {\n            System.out.println("Count: " + i);\n        }\n    }\n}` }
];

let files = DEFAULTS;
let activeId = 0;
let editors = {};
const outputEl = document.getElementById('output');
const runBtn = document.getElementById('run-btn');

// 2. Initialize Java Runtime (CheerpJ)
(async () => {
  try {
    await cheerpjInit();
    document.getElementById('status-dot').className = 'ready';
    document.getElementById('status-text').textContent = 'Java 8 Ready';
    runBtn.disabled = false;
  } catch(e) {
    appendOutput('JVM Load Failed: ' + e, 'err');
  }
})();

// 3. Editor Logic
function createEditor(file) {
  const wrap = document.createElement('div');
  wrap.style.height = "100%";
  wrap.dataset.fileId = file.id;
  document.getElementById('editor-wrap').appendChild(wrap);

  const cm = CodeMirror(wrap, {
    value: file.code,
    mode: 'text/x-java', // Java Mode
    theme: 'dracula',
    lineNumbers: true,
    autoCloseBrackets: true,
    matchBrackets: true,
    indentUnit: 4
  });
  editors[file.id] = cm;
}

function appendOutput(text, type='out') {
  const span = document.createElement('span');
  span.className = type === 'err' ? 'err-line' : 'prompt';
  span.textContent = text;
  outputEl.appendChild(span);
  outputEl.scrollTop = outputEl.scrollHeight;
}

// 4. Run Logic
async function runCode() {
  const code = editors[activeId].getValue();
  outputEl.innerHTML = '';
  appendOutput("☕ Compiling & Executing...\n");
  
  // Create a virtual file for the class
  await cheerpjCreateFile("/str/Main.java", code);
  
  // Run the Main class
  // Note: CheerpJ 3.0 handles the compilation/execution transparently
  try {
    const exitCode = await cheerpjRunMain("Main", "/str/");
    if(exitCode !== 0) appendOutput(`\nProcess exited with code ${exitCode}`, 'err');
  } catch (e) {
    appendOutput("\nRuntime Error: " + e.message, 'err');
  }
}

// 5. Init UI
files.forEach(f => {
  createEditor(f);
  const tab = document.createElement('div');
  tab.className = 'tab active';
  tab.textContent = f.name;
  document.getElementById('tabbar').prepend(tab);
});

runBtn.addEventListener('click', runCode);
</script>
</body>
</html>
