<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMHS CSClub Sandbox - Collab Edition</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #0d0f12;
    --surface:    #13161b;
    --panel:      #181c22;
    --border:     #252a33;
    --accent:     #f7c948;
    --accent2:    #4df0a0;
    --danger:     #f75c5c;
    --text:       #d4d8e0;
    --muted:      #5a6070;
    --tab-h:      42px;
    --toolbar-h:  52px;
  }

  :root.light {
    --bg:      #f5f5f0;
    --surface: #eaeae4;
    --panel:   #e0e0d8;
    --border:  #c8c8be;
    --accent:  #d4a000;
    --accent2: #1a9e60;
    --danger:  #d63030;
    --text:    #1a1a1a;
    --muted:   #7a7a70;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; overflow: hidden; }

  #topbar {
    height: var(--toolbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 14px;
    user-select: none;
  }
  #logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.15rem; color: var(--accent); flex-shrink: 0; }
  .spacer { flex: 1; }
  #pyodide-status { font-size: .7rem; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  #status-dot.ready { background: var(--accent2); }
  #status-dot.loading { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .btn-base { display: flex; align-items: center; gap: 7px; border-radius: 5px; padding: 0 16px; height: 32px; font-family: 'JetBrains Mono', monospace; font-size: .8rem; font-weight: 700; cursor: pointer; border: 1px solid var(--border); transition: all .15s; }
  #run-btn { background: var(--accent); color: #0d0f12; border: none; }
  #run-btn:disabled { opacity: .3; cursor: not-allowed; }
  
  #app { display: flex; flex-direction: column; height: calc(100vh - var(--toolbar-h)); }
  #split { display: flex; flex: 1; overflow: hidden; }
  #editor-wrap { flex: 1; min-width: 0; background: var(--bg); }
  
  /* CM6 Specific Styling to match your UI */
  .cm-editor { height: 100%; outline: none !important; }
  .cm-scroller { font-family: 'JetBrains Mono', monospace !important; }

  #output-panel { width: 35%; background: var(--panel); display: flex; flex-direction: column; border-left: 1px solid var(--border); }
  #output { flex: 1; overflow-y: auto; padding: 15px; font-size: .85rem; white-space: pre-wrap; }
  .err-line { color: var(--danger); }
  .ok-line { color: var(--accent2); }
  .prompt { color: var(--accent); }
</style>
</head>
<body>

<div id="topbar">
  <div id="logo">HMHS<span>/</span>Collab</div>
  <div class="spacer"></div>
  <div id="pyodide-status">
    <div id="status-dot" class="loading"></div>
    <span id="status-text">Loading Python...</span>
  </div>
  <button id="run-btn" class="btn-base" disabled>RUN</button>
  <button id="download-btn" class="btn-base">SAVE</button>
</div>

<div id="app">
  <div id="split">
    <div id="editor-wrap"></div>
    <div id="output-panel">
      <div id="output"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

<script type="module">
    // --- 1. IMPORT COLLAB & CM6 MODULES ---
    import * as Y from 'https://esm.sh/yjs';
    import { WebrtcProvider } from 'https://esm.sh/y-webrtc';
    import { yCollab } from 'https://esm.sh/y-codemirror.next';
    import { EditorView, basicSetup } from 'https://esm.sh/codemirror';
    import { EditorState } from 'https://esm.sh/@codemirror/state';
    import { python } from 'https://esm.sh/@codemirror/lang-python';
    import { oneDark } from 'https://esm.sh/@codemirror/theme-one-dark';

    // --- 2. SETUP YJS COLLABORATION ---
    // Use a unique room name. Everyone with this name will sync.
    const roomName = 'hmhs-cs-sandbox-v1'; 
    const ydoc = new Y.Doc();
    const provider = new WebrtcProvider(roomName, ydoc, {
        signaling: ['wss://signaling.yjs.dev']
    });
    const ytext = ydoc.getText('codemirror');

    // --- 3. INITIALIZE EDITOR ---
    const view = new EditorView({
        state: EditorState.create({
            doc: ytext.toString(),
            extensions: [
                basicSetup,
                python(),
                oneDark, // Dark theme for CM6
                yCollab(ytext, provider.awareness)
            ]
        }),
        parent: document.getElementById('editor-wrap')
    });

    // Handle initial load of text from Yjs
    ytext.observe(e => {
        // This ensures the editor updates if someone else was already in the room
    });

    // --- 4. PYODIDE LOGIC ---
    let pyodide = null;
    const outputEl = document.getElementById('output');

    function appendOutput(text, type='out') {
        const span = document.createElement('div');
        span.className = type === 'err' ? 'err-line' : (type === 'ok' ? 'ok-line' : 'out-line');
        if (type === 'prompt') span.className = 'prompt';
        span.textContent = text;
        outputEl.appendChild(span);
        outputEl.scrollTop = outputEl.scrollHeight;
    }

    async function initPyodide() {
        try {
            pyodide = await loadPyodide({
                stdout: (s) => appendOutput(s),
                stderr: (s) => appendOutput(s, 'err'),
            });
            document.getElementById('status-dot').className = 'ready';
            document.getElementById('status-text').textContent = 'Python Ready';
            document.getElementById('run-btn').disabled = false;
        } catch(e) {
            appendOutput('Pyodide Load Failed: ' + e, 'err');
        }
    }

    async function runCode() {
        if (!pyodide) return;
        outputEl.innerHTML = '';
        appendOutput('▶ Running...', 'prompt');
        
        // Grab current code from the collaborative editor
        const code = view.state.doc.toString();
        
        try {
            await pyodide.runPythonAsync(code);
            appendOutput('✓ Execution Complete', 'ok');
        } catch (err) {
            appendOutput(err.message, 'err');
        }
    }

    // Attach to buttons
    document.getElementById('run-btn').onclick = runCode;
    document.getElementById('download-btn').onclick = () => {
        const code = view.state.doc.toString();
        const blob = new Blob([code], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sandbox_collab.py';
        a.click();
    };

    initPyodide();
</script>

</body>
</html>
